<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashira Sensi Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1f2833;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 2px solid #66fcf1;
        }
        h1 {
            color: #66fcf1;
            margin-bottom: 5px;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p.subtitle {
            color: #45f3ff;
            font-size: 12px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        label {
            display: block;
            text-align: left;
            margin: 12px 0 6px;
            font-weight: bold;
            font-size: 13px;
            color: #45f3ff;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #45f3ff;
            background-color: #0b0c10;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #45f3ff, #1f2833);
            background-color: #45f3ff;
            color: #0b0c10;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.3);
        }
        button:hover {
            background: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
            transform: scale(1.02);
        }
        .results {
            margin-top: 25px;
            padding: 20px;
            background-color: #0b0c10;
            border-radius: 10px;
            border: 1px solid #45f3ff;
            display: none;
            text-align: left;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .results h3 {
            margin-top: 0;
            color: #66fcf1;
            text-align: center;
            font-size: 18px;
            border-bottom: 1px solid #1f2833;
            padding-bottom: 10px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1f2833;
            font-size: 14px;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item strong {
            color: #45f3ff;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ HASHIRA SENSI</h1>
    <p class="subtitle">Gerador de Mira Perfeita v13.0</p>
    
    <label for="device">Tipo de Dispositivo:</label>
    <select id="device">
        <option value="android">Android (Samsung, Xiaomi, Moto)</option>
        <option value="ios">iPhone (iOS)</option>
        <option value="emulador">Emulador (PC)</option>
    </select>

    <label for="weaponType">Foco de Armas:</label>
    <select id="weaponType">
        <option value="um_tiro">Armas de Um Tiro (Desert, Carapina, M1014)</option>
        <option value="smg">Armas de Rajada (UMP, Thompson, ARs)</option>
    </select>

    <button onclick="generateHashiraSensi()">Desbloquear Sensi Pilar</button>

    <div id="results" class="results">
        <h3>🔥 CONFIGURAÇÃO GERADA</h3>
        <div class="result-item"><span>Geral:</span> <strong id="res-geral">-</strong></div>
        <div class="result-item"><span>Ponto Vermelho (Red Dot):</span> <strong id="res-red">-</strong></div>
        <div class="result-item"><span>Mira 2x:</span> <strong id="res-2x">-</strong></div>
        <div class="result-item"><span>Mira 4x:</span> <strong id="res-4x">-</strong></div>
        <div class="result-item"><span>Tamanho do Botão:</span> <strong id="res-botao">-</strong></div>
        <div class="result-item"><span>Configuração de DPI:</span> <strong id="res-dpi">-</strong></div>
        <div class="result-item"><span>Aceleração de Tela:</span> <strong id="res-acele">-</strong></div>
    </div>
</div>

<script>
    function getRandomValue(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateHashiraSensi() {
        const device = document.getElementById("device").value;
        const weapon = document.getElementById("weaponType").value;

        let geral, red, m2x, m4x, botao, dpi, acele;

        if (weapon === "um_tiro") {
            geral = getRandomValue(85, 94);
            red = getRandomValue(60, 75);
            m2x = getRandomValue(88, 95);
            m4x = getRandomValue(82, 90);
            botao = "52%";
        } else {
            geral = getRandomValue(96, 100);
            red = getRandomValue(85, 99);
            m2x = getRandomValue(98, 100);
            m4x = getRandomValue(94, 98);
            botao = "38%";
        }

        if (device === "ios") {
            dpi = "Ciclos: 120 (Refinado)";
            acele = "Ajuste Individual: 100";
        } else if (device === "emulador") {
            dpi = "Mouse: 800 a 1000 DPI";
            acele = "Ajuste de Eixo Y: Moderado";
        } else {
            dpi = weapon === "um_tiro" ? "608 DPI (Média)" : "914 DPI (Alta)";
            acele = "Ativada (Velocidade do Ponteiro no Máx)";
        }

        document.getElementById("res-geral").textContent = geral;
        document.getElementById("res-red").textContent = red;
        document.getElementById("res-2x").textContent = m2x;
        document.getElementById("res-4x").textContent = m4x;
        document.getElementById("res-botao").textContent = botao;
        document.getElementById("res-dpi").textContent = dpi;
        document.getElementById("res-acele").textContent = acele;

        document.getElementById("results").style.display = "block";
    }
</script>

</body>
  </html>
